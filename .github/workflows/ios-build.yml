name: iOS Build and Submit to TestFlight

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Release notes (optional)'
        required: false
        default: ''

jobs:
  build-and-submit:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Xcode diagnostics
        run: |
          echo "--- Available Xcode installs ---"
          ls /Applications/ | grep Xcode || echo "none"
          echo "--- Current xcode-select ---"
          xcode-select -p || true
          xcodebuild -version || true

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build iOS app (EAS cloud)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile github \
            --non-interactive \
            --wait

      - name: Submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive
