name: Staging OTA Update

# Publishes an OTA update to the EAS 'staging' channel.
# Targets only the staging app (com.clickfuzz.elmer.staging, channel: staging).
# The production channel is never touched by this workflow.
#
# AUTOMATIC TRIGGER IS DISABLED until the staging Railway environment is live
# (https://api-staging.getelmer.com must return {"ok":true} from /health).
# To re-enable after Railway staging is configured, uncomment the push block below.
#
# on:
#   push:
#     branches: [staging]
#     paths-ignore:
#       - 'server/**'
#       - 'docs/**'
#       - '*.md'
#       - '.github/workflows/test.yml'

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message'
        required: false
        default: 'Staging update'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify staging channel target
        run: |
          echo "Publishing OTA update to staging channel (NOT production)"
          echo "Branch: staging | Channel: staging | Platform: ios"
          echo "API URL: https://api-staging.getelmer.com"

      - name: Publish staging OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_VARIANT: staging
          EXPO_PUBLIC_API_URL: https://api-staging.getelmer.com
          EXPO_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          # EXPO_PUBLIC_POSTHOG_API_KEY is intentionally omitted — PostHog disabled in staging
        run: |
          MESSAGE="${{ github.event.inputs.message }}"
          eas update \
            --platform ios \
            --branch staging \
            --channel staging \
            --message "$MESSAGE" \
            --non-interactive
