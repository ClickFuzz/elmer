<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — elmer.</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <div class="card">
      <div style="text-align:center;margin-bottom:28px;">
        <a href="login.html">
          <span class="wordmark">elmer<span class="wordmark-period">.</span></span>
        </a>
      </div>

      <div id="requestPanel">
        <h1 class="card-title">Reset your password</h1>
        <p class="card-subtitle">Enter your email address and we'll send you a reset link.</p>

        <form id="forgotForm" novalidate autocomplete="on">
          <div class="form-group">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" name="email" autocomplete="email"
              placeholder="you@example.com" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-full" id="forgotBtn"
              data-loading-text="Sending…">Send reset link</button>
          </div>
        </form>
        <div id="forgotAlert" class="alert alert-hidden" role="alert"></div>
      </div>

      <!-- Success state: shown after submission regardless of whether email exists -->
      <div id="successPanel" class="hidden">
        <div class="alert alert-success" style="margin-top:0;margin-bottom:20px;">
          If that address is registered, you'll receive a reset link within a few minutes.
          Check your spam folder if it doesn't arrive.
        </div>
        <p style="font-size:14px;color:var(--muted);margin-bottom:20px;">
          The link expires in 1 hour and can only be used once.
        </p>
      </div>

      <div class="form-footer">
        <a href="login.html">← Back to login</a>
      </div>

    </div>
  </div>

  <script src="common.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
