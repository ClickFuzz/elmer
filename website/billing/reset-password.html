<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — elmer.</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <div class="card">
      <div style="text-align:center;margin-bottom:28px;">
        <a href="login.html">
          <span class="wordmark">elmer<span class="wordmark-period">.</span></span>
        </a>
      </div>

      <!-- Invalid/missing token state -->
      <div id="invalidPanel" class="hidden">
        <div class="alert alert-error" style="margin-top:0;margin-bottom:20px;">
          This reset link is invalid or has expired. Reset links are valid for 1 hour and
          can only be used once.
        </div>
        <a href="forgot-password.html" class="btn btn-secondary btn-full">Request a new link</a>
      </div>

      <!-- Reset form (shown when token present) -->
      <div id="resetPanel" class="hidden">
        <h1 class="card-title">Set a new password</h1>
        <p class="card-subtitle">Choose a strong password for your Elmer account.</p>

        <form id="resetForm" novalidate autocomplete="on">
          <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" name="password" autocomplete="new-password"
              placeholder="At least 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" name="confirm" autocomplete="new-password"
              placeholder="Repeat your new password" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-full" id="resetBtn"
              data-loading-text="Saving…">Set new password</button>
          </div>
        </form>
        <div id="resetAlert" class="alert alert-hidden" role="alert"></div>
      </div>

    </div>
  </div>

  <script src="common.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
